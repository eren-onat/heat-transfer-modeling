name: Clean portfolio notebook

on:
  push:
    paths:
      - '.github/workflows/clean-notebook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Strip outputs and fix explanatory cell
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('heat_transfer_modeling.ipynb')
          nb = json.loads(path.read_text(encoding='utf-8'))

          for cell in nb.get('cells', []):
              source_text = ''.join(cell.get('source', []))
              if cell.get('cell_type') == 'code' and source_text.lstrip().startswith('# 🚀 Spacecraft Wall Demo:'):
                  cell['cell_type'] = 'markdown'
                  cell.pop('outputs', None)
                  cell.pop('execution_count', None)
              elif cell.get('cell_type') == 'code':
                  cell['outputs'] = []
                  cell['execution_count'] = None

          path.write_text(json.dumps(nb, indent=1, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Commit cleaned notebook
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add heat_transfer_modeling.ipynb
          if ! git diff --cached --quiet; then
            git commit -m 'Clean heat transfer portfolio notebook'
            git pull --rebase origin main
            git push
          fi
