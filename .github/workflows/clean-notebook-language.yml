name: Clean notebook wording

on:
  push:
    paths:
      - ".github/workflows/clean-notebook-language.yml"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean notebook text and comments
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          notebook_path = Path("heat_transfer_modeling.ipynb")
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))

          intro = (
              "# 1D Heat Transfer Modeling\n\n"
              "I built this notebook to see how thermal diffusivity changes the way heat "
              "moves through a material. The model solves the one-dimensional heat equation "
              "with an explicit finite-difference method and fixed temperatures at the boundaries."
          )

          exact_replacements = {
              "# Physical and numerical parameters": "# Model parameters",
              "# Initial and boundary conditions": "# Initial and boundary conditions",
              "# Time stepping (explicit finite differences)": "# Explicit time stepping",
              "alpha = 1.2e-4          # thermal diffusivity (m^2/s), example material": "alpha = 1.2e-4          # thermal diffusivity (m^2/s)",
              "# Save snapshots for plotting": "# Times saved for plotting",
              "# Dirichlet boundary conditions": "# Fixed boundary temperatures",
              "# Always provide requested snapshot times via nearest simulated time index": "# Use the nearest simulated time for each requested snapshot",
              "# Example diffusivities (m^2/s)": "# Thermal diffusivity values (m^2/s)",
              "alpha_high = 1.2e-4  # RCC-like high-diffusivity order of magnitude": "alpha_high = 1.2e-4  # higher-diffusivity case",
          }

          first_markdown = True
          for cell in notebook.get("cells", []):
              source = "".join(cell.get("source", []))

              if cell.get("cell_type") == "markdown":
                  if first_markdown:
                      source = intro
                      first_markdown = False
                  else:
                      lines = []
                      for line in source.splitlines():
                          if line.strip() in {"---", "***", "___"}:
                              continue
                          line = line.replace("This section models", "This part models")
                          line = line.replace("The project demonstrates", "The notebook uses")
                          line = line.replace("In this section, we", "Here, I")
                          line = line.replace("we compare", "I compare")
                          line = line.replace("We compare", "I compare")
                          line = line.replace("we model", "I model")
                          line = line.replace("We model", "I model")
                          lines.append(line)
                      source = "\n".join(lines).strip()

              elif cell.get("cell_type") == "code":
                  cleaned = []
                  for line in source.splitlines():
                      if re.match(r"^\s*#\s*-{2,}.*-{2,}\s*$", line):
                          text = re.sub(r"^\s*#\s*-{2,}\s*|\s*-{2,}\s*$", "", line).strip()
                          line = f"# {text}" if text else ""

                      stripped = line.strip()
                      if stripped in exact_replacements:
                          indent = line[: len(line) - len(line.lstrip())]
                          line = indent + exact_replacements[stripped]

                      line = line.replace(" # example material", "")
                      line = line.replace("# Example material", "# Material value used in this run")
                      line = line.replace("# illustrative case", "# comparison case")

                      if line:
                          cleaned.append(line.rstrip())
                  source = "\n".join(cleaned).rstrip()

              cell["source"] = [line + "\n" for line in source.splitlines()]
              if cell["source"]:
                  cell["source"][-1] = cell["source"][-1].rstrip("\n")

          notebook_path.write_text(
              json.dumps(notebook, indent=1, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit notebook cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heat_transfer_modeling.ipynb
          if ! git diff --cached --quiet; then
            git commit -m "Clean up notebook wording and comments"
            git push
          fi
