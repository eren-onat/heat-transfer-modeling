name: Import portfolio project

on:
  push:
    paths:
      - '.github/workflows/import-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio repository
        uses: actions/checkout@v4

      - name: Check out source coursework
        uses: actions/checkout@v4
        with:
          repository: eren-onat/Math440
          path: source-math440

      - name: Copy project notebook and clean presentation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path('source-math440/heat_equation_model.ipynb')
          dst = Path('heat_transfer_modeling.ipynb')

          nb = json.loads(src.read_text(encoding='utf-8'))
          for cell in nb.get('cells', []):
              source_text = ''.join(cell.get('source', []))

              # The original notebook contains one explanatory section that was
              # accidentally saved as a code cell. Correct only that cell type.
              if cell.get('cell_type') == 'code' and source_text.lstrip().startswith('# 🚀 Spacecraft Wall Demo:'):
                  cell['cell_type'] = 'markdown'
                  cell.pop('outputs', None)
                  cell.pop('execution_count', None)

              if cell.get('cell_type') == 'code':
                  cell['outputs'] = []
                  cell['execution_count'] = None

          dst.write_text(json.dumps(nb, indent=1, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          rm -rf source-math440

      - name: Commit cleaned portfolio notebook
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add heat_transfer_modeling.ipynb
          if ! git diff --cached --quiet; then
            git commit -m 'Fix notebook presentation and execution'
            git pull --rebase origin main
            git push
          fi
